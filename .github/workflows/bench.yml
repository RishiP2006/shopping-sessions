name: bench
on:
  push:
    branches: [bench]
  workflow_dispatch:
jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Machine
        run: |
          lscpu | grep -E "Model name|^CPU\(s\)|Thread|Core|Socket|L2|L3|Flags" | cut -c1-200
          free -g; uname -r
      - name: Tools
        run: |
          pip install -q polars
          curl -sSfL -o /tmp/gen.zip https://www.joinbuilders.org/buildathon/tracks/shopping-sessions/files/generator.zip
          curl -sSfL -o /tmp/ans.zip https://www.joinbuilders.org/buildathon/tracks/shopping-sessions/files/dev-answer.zip
          mkdir -p /tmp/gen /tmp/ans && unzip -q /tmp/gen.zip -d /tmp/gen && unzip -q /tmp/ans.zip -d /tmp/ans
          cd /tmp/gen/generator && cargo build --release -q
      - name: Data
        run: |
          G=/tmp/gen/generator/target/release/generate
          $G --seed 1 --events 1000000 --clicks 250000 --output /tmp/dev >/dev/null
          $G --seed 7 --events 20000000 --clicks 5000000 --output /tmp/p20 >/dev/null
          du -sh /tmp/p20
      - name: Build
        run: |
          g++ -O3 -march=haswell -mtune=skylake-avx512 -std=c++17 -static -pthread -o /tmp/pipeline src/pipeline.cpp
          g++ -O3 -g -march=haswell -std=c++17 -pthread -o /tmp/pipeline_g src/pipeline.cpp
          # variants: "name ref env-assignments -- extra g++ flags" ; ref HEAD = current source
          [ -f .github/variants ] || echo "new HEAD --" > .github/variants
          while read -r name ref rest; do
            [ -z "$name" ] && continue
            envs="${rest%%--*}"; flags="${rest#*--}"
            mkdir -p /tmp/v/$name
            if [ "$ref" = HEAD ]; then cp src/pipeline.cpp src/parquet.hpp /tmp/v/$name/; else
              git show $ref:src/pipeline.cpp > /tmp/v/$name/pipeline.cpp; git show $ref:src/parquet.hpp > /tmp/v/$name/parquet.hpp; fi
            g++ -O3 -march=haswell -mtune=skylake-avx512 -std=c++17 -static -pthread $flags -o /tmp/v/$name/bin /tmp/v/$name/pipeline.cpp
            echo "$envs" > /tmp/v/$name/env
            echo "variant $name ref=$ref env=[$envs] flags=[$flags]"
          done < .github/variants
      - name: Correctness
        run: |
          python3 scripts/run_fixtures.py fixtures -- /tmp/pipeline | tail -1
          rm -rf /tmp/o && DATA_DIR=/tmp/dev OUTPUT_DIR=/tmp/o /tmp/pipeline 2>/dev/null
          cd scripts && python3 compare.py /tmp/o /tmp/ans/dev-answer | tail -1
      - name: Docker image (scorer flags)
        run: |
          docker build -q -t shopping-sessions:latest . > /dev/null
          docker images shopping-sessions:latest --format "image size {{.Size}}"
          python3 scripts/run_fixtures.py fixtures -- scripts/docker_run.sh | tail -1
          rm -rf /tmp/od && scripts/docker_run.sh /tmp/dev /tmp/od 2>/dev/null
          (cd scripts && python3 compare.py /tmp/od /tmp/ans/dev-answer | tail -1)
          for i in 1 2 3; do
            rm -rf /tmp/od; s=$(date +%s.%N)
            CPUS=4 MEM=12g scripts/docker_run.sh /tmp/p20 /tmp/od 2>/dev/null
            e=$(date +%s.%N); echo "docker p20 run: $(echo "$e - $s" | bc) s"
          done
      - name: Bench
        run: |
          cat /tmp/p20/*/*.csv > /dev/null
          names=$(ls /tmp/v)
          for i in 1 2 3 4 5; do
            for v in $names; do
              rm -rf /tmp/o
              printf "%s " $v
              env $(cat /tmp/v/$v/env) DATA_DIR=/tmp/p20 OUTPUT_DIR=/tmp/o NCPU=4 /usr/bin/time -f "%e wall %U user %S sys" /tmp/v/$v/bin 2>&1 | tr '\n' ' ' | tee -a /tmp/res_$v; echo
              echo >> /tmp/res_$v
            done
          done
          echo "== SUMMARY median wall"
          for v in $names; do
            m=$(grep -o '[0-9.]* wall' /tmp/res_$v | sort -n | sed -n 3p || true)
            echo "SUM $v $m"
          done
      - name: Profile
        continue-on-error: true
        run: |
          sudo apt-get install -y -qq linux-tools-common linux-tools-$(uname -r) >/dev/null 2>&1 || true
          sudo sysctl -w kernel.perf_event_paranoid=-1 >/dev/null
          rm -rf /tmp/o
          DATA_DIR=/tmp/p20 OUTPUT_DIR=/tmp/o NCPU=4 perf stat -e task-clock,cycles,instructions,branch-misses,cache-misses /tmp/pipeline_g 2>&1 | tail -14
          rm -rf /tmp/o
          DATA_DIR=/tmp/p20 OUTPUT_DIR=/tmp/o NCPU=4 perf record -F 2000 -o /tmp/perf.data /tmp/pipeline_g 2>/dev/null >/dev/null
          perf report -i /tmp/perf.data --no-children --sort symbol --stdio 2>/dev/null | grep -E "^ +[0-9]" | cut -c1-110 | head -30
          echo "== SRCLINE"
          perf report -i /tmp/perf.data --no-children --sort srcline --stdio 2>/dev/null | grep -E "^ +[0-9]" | cut -c1-110 | head -70
